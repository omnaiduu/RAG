name: Modal GPU check

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "Modal GPU type (T4, L4, A10G, A100, H100)"
        default: "T4"
        required: true

jobs:
  gpu-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - name: Run GPU check on Modal
        env:
          RAW_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GPU_TYPE: ${{ inputs.gpu }}
        run: |
          # Strip stray whitespace/newlines that sneak in when secrets are pasted.
          export MODAL_TOKEN_ID="$(printf '%s' "$RAW_MODAL_TOKEN_ID" | tr -d '[:space:]')"
          export MODAL_TOKEN_SECRET="$(printf '%s' "$RAW_MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          modal run modal_jobs/gpu_check.py
